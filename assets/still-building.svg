<svg width="640" height="72" viewBox="0 0 640 72" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Still building</title>
  <desc id="desc">Terminal-style still building tag line in rainbow colors.</desc>

  <defs>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff5f56"/>
      <stop offset="18%" stop-color="#ffbd2e"/>
      <stop offset="34%" stop-color="#27c93f"/>
      <stop offset="50%" stop-color="#58d6ff"/>
      <stop offset="68%" stop-color="#8b9cff"/>
      <stop offset="84%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#ff7eb6"/>
    </linearGradient>

    <filter id="soft-glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="640" height="72" rx="12" fill="#0d1117"/>
  <text
    x="320"
    y="46"
    text-anchor="middle"
    font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace"
    font-size="30"
    font-weight="700"
    fill="url(#rainbow)"
    filter="url(#soft-glow)">
    &gt; still building_
  </text>
</svg>
